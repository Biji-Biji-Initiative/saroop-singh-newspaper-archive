name: Web CI

# This job serves pull_request, so it executes PR-authored source. It runs on
# mereka-k8s-untrusted-ci: the ARC lane profiled for untrusted PR code (no
# cluster/secret authority), because GitHub-hosted runners are disabled
# org-wide and the required "Verify web build" context must actually report.
on:
  pull_request:
  push:
    branches:
      - main
      - codex/saroop-coolify-cutover
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-web:
    name: Verify web build
    runs-on: mereka-k8s-untrusted-ci
    timeout-minutes: 20
    defaults:
      run:
        working-directory: saroop-singh-archive/packages/web
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci --workspaces=false

      - name: Validate the canonical published article corpus
        run: npm run validate:content

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Build and run the complete archive suite
        env:
          ARCHIVE_DATA_DIR: /tmp/saroop-archive-ci
          NEXT_PUBLIC_SITE_ORIGIN: https://saroop.mereka.dev
          ARCHIVE_PUBLIC_ORIGIN: https://saroop.mereka.dev
        run: npm test

      - name: Build the production Coolify image
        working-directory: .
        # The untrusted ARC lane has no Docker daemon. Coolify builds this same
        # Dockerfile on deploy, and Deploy production fails unless that build
        # finishes at the verified SHA, so the image build is still gated.
        run: |
          if docker info >/dev/null 2>&1; then
            docker build --tag saroop-archive:ci .
          else
            echo "::notice::No Docker daemon on this runner; the Dockerfile is built and gated by Coolify in Deploy production."
          fi

      - name: Reject high-severity production dependency findings
        run: npm audit --omit=dev --audit-level=high
